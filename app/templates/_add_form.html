<div class="p-5">
  <div class="flex items-start justify-between mb-4">
    <div>
      <h2 class="text-xl font-bold text-white">Add a job manually</h2>
      <p class="text-sm text-slate-400 mt-1">Paste a URL, title, and description. It's scored by AI like any other job.</p>
    </div>
    <button onclick="closeDrawer()" class="text-slate-400 hover:text-white text-2xl leading-none">×</button>
  </div>

  <form hx-post="/jobs/add" hx-target="#job-list" hx-swap="innerHTML" class="space-y-4">
    <div>
      <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Job URL <span class="text-red-400">*</span></label>
      <input type="url" name="url" required placeholder="https://…"
        class="w-full bg-panel2 border border-edge rounded px-3 py-2 text-sm focus:outline-none focus:border-accent" />
    </div>
    <div>
      <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Title <span class="text-red-400">*</span></label>
      <input type="text" name="title" required placeholder="e.g. Senior Laravel Developer"
        class="w-full bg-panel2 border border-edge rounded px-3 py-2 text-sm focus:outline-none focus:border-accent" />
    </div>
    <div>
      <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Company</label>
      <input type="text" name="company" placeholder="optional"
        class="w-full bg-panel2 border border-edge rounded px-3 py-2 text-sm focus:outline-none focus:border-accent" />
    </div>
    <div>
      <label class="block text-xs uppercase tracking-wide text-slate-400 mb-1">Description</label>
      <textarea name="description" rows="8" placeholder="Paste the job description here…"
        class="w-full bg-panel2 border border-edge rounded px-3 py-2 text-sm focus:outline-none focus:border-accent"></textarea>
    </div>
    <div class="flex items-center gap-3 pt-1">
      <button type="submit" class="px-4 py-2 rounded bg-accent hover:bg-blue-500 text-white text-sm font-medium">Add job</button>
      <button type="button" onclick="closeDrawer()" class="text-sm text-slate-400 hover:text-slate-200">Cancel</button>
    </div>
  </form>
</div>
